services:
  replay:
    build: .
    image: avionmesh-pi:offline
    network_mode: none
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # One-shot replay. No broker, Bluetooth, host D-Bus or restart policy.
    command: [replay, fixtures/session.jsonl]
