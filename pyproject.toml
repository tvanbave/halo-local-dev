[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avionmesh-pi"
version = "0.5.0.dev78"
description = "Development Avi-on mesh bridge service for Docker on Raspberry Pi"
requires-python = ">=3.10"
dependencies = ["cryptography>=44,<49", "bleak>=3.0.2,<4", "aiomqtt==2.5.1", "aiohttp>=3.12,<4"]
license = {text = "LGPL-3.0-only"}

[project.scripts]
avionmesh-pi = "avionmesh_pi.__main__:main"

[tool.setuptools.packages.find]
include = ["avionmesh_pi*"]

[tool.setuptools.package-data]
avionmesh_pi = ["web/ui.html", "web/ui.css", "web/ui.js", "web/settings.js", "web/ops.js", "web/setup.html", "web/setup.js", "web/setup.css", "web/backup.js"]
